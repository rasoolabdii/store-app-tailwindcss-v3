<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>فروشگاه دیجیت</title>
    <link rel="stylesheet" href="./build/tailwind.css" />
</head>

<body class="bg-gray-100">
    <!-- app bar -->
    <div class="flex md:hidden items-center justify-between mt-10 px-4 mb-6">
        <div class="">Digit Logo</div>
        <div class="text-lg font-bold text-slate-800">ساعت هوشمند</div>
        <div class="w-7 h-7 rounded items-center justify-center bg-white shadow-lg flex">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="h-5 w-5 stroke-slate-800">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
        </div>
    </div>
    <!-- filter sort section -->
    <div class="flex md:hidden items-center justify-between px-4 gap-x-4 mb-9">
        <div class="flex items-center justify-start bg-white rounded py-2 pl-4 w-1/2">
            <div>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-6 h-6 stroke-orange-600">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 4.5h14.25M3 9h9.75M3 13.5h9.75m4.5-4.5v12m0 0-3.75-3.75M17.25 21 21 17.25" />
                </svg>
            </div>
            <span class="text-sm text-slate-800 mr-3">محبوب ترین</span>
        </div>
        <div class="flex items-center justify-start bg-white rounded py-2 pl-4 w-1/2">
            <div>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="w-6 h-6 stroke-gray-300">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z" />
                </svg>
            </div>
            <span class="text-sm text-slate-800 mr-3">فیلتر: اپل</span>
        </div>
    </div>
    <!-- desktop navbar -->
    <div>
        <nav class="bg-white p-4 shadow-lg sticky z-10 top-0 hidden md:block mb-8">
            <div class="container 2xl:max-w-screen-2xl mx-auto flex items-center justify-between">
                <ul class="flex items-center gap-x- lg:gap-x-2 text-slate-800 text-lg">
                    <li>
                        <a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-100 transition-all duration-300">
                            LOGO
                        </a>
                    </li>
                    <li>
                        <a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-100 transition-all duration-300">
                            خانه
                        </a>
                    </li>
                    <li>
                        <a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-100 transition-all duration-300">
                            لپ تاپ
                        </a>
                    </li>
                    <li>
                        <a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-100 transition-all duration-300">
                            تب لت
                        </a>
                    </li>
                    <li>
                        <a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-100 transition-all duration-300">
                            ساعت هوشمند
                        </a>
                    </li>
                    <li>
                        <a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-100 transition-all duration-300">
                            تلفن همراه
                        </a>
                    </li>
                </ul>
                <!-- search bar -->
                <div class="flex-1 max-w-xl mr-4 ">
                    <div class="flex bg-gray-100 p-1 rounded-lg items-center">
                        <span class="ml-3 mr-1">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                            </svg>
                        </span>
                        <input 
                            type="text" placeholder="نام محصول برند یا رنگ ..." 
                            class="focus:outline-none bg-transparent w-full p-2 text-slate-800"
                        />
                    </div>
                </div>
            </div>
        </nav>
    </div>
    <!-- content -->
    <div class="md:px-2 lg:px-4 container mx-auto max-w-screen-2xl grid grid-cols-12 md:grid-rows-[55px_minmax(500px,_1fr)] md:gap-8">
        <!-- sidebar  -->
        <div class="col-span-4 lg:col-span-3 row-span-2 xl:col-span-2 hidden md:block">
            <div class="bg-white p-5 rounded-xl max-h-[calc(100vh_-_140px)] overflow-y-auto sticky top-28 z-20">
                <!-- categories -->
                <div class="mb-7">
                    <div class="text-lg mb-5 font-bold text-orange-500">دسته بندی</div>
                    <ul class="">
                        <li class="mb-2">
                            <a href="#" class="flex items-center gap-x-2 py-2 transition-all duration-400 text-slate-800 hover:bg-gray-100 cursor-pointer rounded-md">
                                <span class="relative w-7 h-7 rounded-full bg-gray-100">
                                    <svg class="w-5 h-5 absolute top-2.5 right-3" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 0 0 6 3.75v16.5a2.25 2.25 0 0 0 2.25 2.25h7.5A2.25 2.25 0 0 0 18 20.25V3.75a2.25 2.25 0 0 0-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" />
                                    </svg>
                                </span>
                                <span class="">گوشی موبایل</span>
                            </a>
                        </li>
                        <li class="mb-2">
                            <a href="#" class="flex items-center gap-x-2 py-2 transition-all duration-400 text-slate-800 hover:bg-gray-100 cursor-pointer rounded-md">
                                <span class="relative w-7 h-7 rounded-full bg-gray-100">
                                    <svg class="w-5 h-5 absolute top-2.5 right-3" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 0 0 6 3.75v16.5a2.25 2.25 0 0 0 2.25 2.25h7.5A2.25 2.25 0 0 0 18 20.25V3.75a2.25 2.25 0 0 0-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" />
                                    </svg>
                                </span>
                                <span class="">تب لت</span>
                            </a>
                        </li>
                        <li class="mb-2">
                            <a href="#" class="flex items-center gap-x-2 py-2 transition-all duration-400 text-slate-800 hover:bg-gray-100 cursor-pointer rounded-md">
                                <span class="relative w-7 h-7 rounded-full bg-gray-100">
                                    <svg class="w-5 h-5 absolute top-2.5 right-3" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 0 0 6 3.75v16.5a2.25 2.25 0 0 0 2.25 2.25h7.5A2.25 2.25 0 0 0 18 20.25V3.75a2.25 2.25 0 0 0-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" />
                                    </svg>
                                </span>
                                <span class="">لپ تاپ</span>
                            </a>
                        </li>
                    </ul>
                </div>
                <!-- desktop filters -->
                <div>
                    <div class="text-xl font-bold text-orange-500 mb-5">فیلتر ها</div>
                    <!-- ACC No 1 -->
                    <div class="mb-4" x-data="{isOpenBrand: true}">
                        <!-- ACC header -->
                         <div @click="isOpenBrand = !isOpenBrand" class="flex items-center justify-between mb-4 w-full p-2 cursor-pointer hover:bg-gray-100 rounded-lg">
                            <div class="flex items-center">
                                <span class="flex items-center gap-x-2 transition-all duration-400 text-slate-800 hover:bg-gray-100 cursor-pointer rounded-md">
                                    <span class="relative w-7 h-7 rounded-full bg-gray-100">
                                        <svg class="w-5 h-5 absolute top-2.5 right-3" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 0 0 6 3.75v16.5a2.25 2.25 0 0 0 2.25 2.25h7.5A2.25 2.25 0 0 0 18 20.25V3.75a2.25 2.25 0 0 0-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" />
                                        </svg>
                                    </span>
                                    <span class="mr-3">برند محصول</span>
                                </span>
                            </div>
                            <span>
                                <svg  class="w-5 h-5 transition-all duration-500" :class="isOpenBrand ? '0deg' : 'rotate-180' " xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                                </svg>
                            </span>
                         </div>
                         <!-- ACC Content -->
                          <div class=" px-2 flex flex-col gap-y-2" x-show="isOpenBrand === true">
                            <label class="py-2 flex items-center cursor-pointer" for="apple">
                                <input type="checkbox" name="brand" id="apple" class="form-checkbox rounded-md text-orange-500 focus:ring-orange-500" />
                                <span class="text-md mr-2">اپل</span>
                            </label>
                            <label class="py-2 flex items-center cursor-pointer" for="nokia">
                                <input type="checkbox" name="brand" id="nokia" class="form-checkbox rounded-md text-orange-500 focus:ring-orange-500" />
                                <span class="text-md mr-2">نوکیا</span>
                            </label>
                            <label class="py-2 flex items-center cursor-pointer" for="sumsung">
                                <input type="checkbox" name="brand" id="sumsung" class="form-checkbox rounded-md text-orange-500 focus:ring-orange-500" />
                                <span class="text-md mr-2">سامسونگ</span>
                            </label>
                          </div>
                    </div>
                </div>
                <div>
                     <!-- ACC No 2 -->
                    <div class="mb-4" x-data="{isOpenColor: true}">
                        <!-- ACC header -->
                         <div @click="isOpenColor = !isOpenColor" class="flex items-center justify-between mb-4 w-full p-2 cursor-pointer hover:bg-gray-100 rounded-lg">
                            <div class="flex items-center">
                                <span class="flex items-center gap-x-2 transition-all duration-400 text-slate-800 hover:bg-gray-100 cursor-pointer rounded-md">
                                    <span class="relative w-7 h-7 rounded-full bg-gray-100">
                                        <svg class="w-5 h-5 absolute top-2.5 right-3" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 0 0 6 3.75v16.5a2.25 2.25 0 0 0 2.25 2.25h7.5A2.25 2.25 0 0 0 18 20.25V3.75a2.25 2.25 0 0 0-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" />
                                        </svg>
                                    </span>
                                    <span class="mr-3">رنگ محصول</span>
                                </span>
                            </div>
                            <span>
                                <svg  class="w-5 h-5 transition-all duration-500" :class="isOpenColor ? '0deg' : 'rotate-180' " xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                                </svg>
                            </span>
                         </div>
                         <!-- ACC Content -->
                          <div class=" px-2 flex flex-col gap-y-2" x-show="isOpenColor === true">
                            <label class="py-2 flex items-center cursor-pointer" for="yellow">
                                <input type="checkbox" name="color" id="yellow" class="form-checkbox rounded-md text-yellow-500 focus:ring-yellow-500" />
                                <span class="text-md mr-2">زرد</span>
                            </label>
                            <label class="py-2 flex items-center cursor-pointer" for="pink">
                                <input type="checkbox" name="color" id="pink" class="form-checkbox rounded-md text-yellow-500 focus:ring-yellow-500" />
                                <span class="text-md mr-2">صورتی</span>
                            </label>
                            <label class="py-2 flex items-center cursor-pointer" for="red">
                                <input type="checkbox" name="color" id="red" class="form-checkbox rounded-md text-yellow-500 focus:ring-yellow-500" />
                                <span class="text-md mr-2">قرمز</span>
                            </label>
                          </div>
                    </div>
                </div>
                <div>
                     <!-- ACC No 3 -->
                    <div class="" x-data="{isOpenPrice: true}">
                        <!-- ACC header -->
                         <div @click="isOpenPrice = !isOpenPrice" class="flex items-center justify-between mb-4 w-full p-2 cursor-pointer hover:bg-gray-100 rounded-lg">
                            <div class="flex items-center">
                                <span class="flex items-center gap-x-2 transition-all duration-400 text-slate-800 hover:bg-gray-100 cursor-pointer rounded-md">
                                    <span class="relative w-7 h-7 rounded-full bg-gray-100">
                                        <svg class="w-5 h-5 absolute top-2.5 right-3" stroke="currentColor" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5">
                                            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 0 0 6 3.75v16.5a2.25 2.25 0 0 0 2.25 2.25h7.5A2.25 2.25 0 0 0 18 20.25V3.75a2.25 2.25 0 0 0-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" />
                                        </svg>
                                    </span>
                                    <span class="mr-3">محدودیت قیمت</span>
                                </span>
                            </div>
                            <span>
                                <svg  class="w-5 h-5 transition-all duration-500" :class="isOpenPrice ? '0deg' : 'rotate-180' " xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
                                </svg>
                            </span>
                         </div>
                         <!-- ACC Content -->
                          <div class=" px-2 flex flex-col gap-y-2" x-show="isOpenPrice === true">
                            <label class="py-2 flex items-center cursor-pointer" for="up2">
                                <input type="checkbox" name="color" id="up2" class="form-checkbox rounded-md text-lime-300 focus:ring-lime-400" />
                                <span class="text-md mr-2">بالای 2 میلیون</span>
                            </label>
                            <label class="py-2 flex items-center cursor-pointer" for="up4">
                                <input type="checkbox" name="color" id="up4" class="form-checkbox rounded-md text-lime-300 focus:ring-lime-400" />
                                <span class="text-md mr-2">بالای 4 میلیون</span>
                            </label>
                            <label class="py-2 flex items-center cursor-pointer" for="up10">
                                <input type="checkbox" name="color" id="up10" class="form-checkbox rounded-md text-lime-300 focus:ring-lime-400" />
                                <span class="text-md mr-2">بالای 10 میلیون</span>
                            </label>
                          </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- sort section -->
        <div class="col-span-8 lg:col-span-9 hidden md:block xl:col-span-10"> 
            <div x-data="{sort: 1 , activeClass: 'text-slate-800 font-bold'}"  class="bg-white px-4 flex items-center gap-x-4 text-gray-400 rounded-lg">
                <div class="bg-orange-100 rounded-md flex items-center justify-center p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8 stroke-orange-500">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 4.5h14.25M3 9h9.75M3 13.5h9.75m4.5-4.5v12m0 0-3.75-3.75M17.25 21 21 17.25" />
                    </svg>
                </div>
                <button @click="sort = 1" :class="sort === 1 ? activeClass : '' " class="py-4 relative">
                    <span>محبوب ترین</span>
                    <span x-show="sort === 1" class="w-2 h-2 bg-orange-600 rounded-full absolute top-1 left-1"></span>
                </button>
                <button @click="sort = 2" :class="sort === 2 ? activeClass : '' " class="py-4 relative">
                    <span>گران ترین</span>
                    <span x-show="sort === 2" class="w-2 h-2 bg-orange-600 rounded-full absolute top-1 left-1"></span>
                </button>
                <button @click="sort = 3" :class="sort === 3 ? activeClass : '' " class="py-4 relative">
                    <span>ارزان ترین</span>
                    <span x-show="sort === 3" class="w-2 h-2 bg-orange-600 rounded-full absolute top-1 left-1"></span>
                </button>
                <button @click="sort = 4" :class="sort === 4 ? activeClass : '' " class="py-4 relative">
                    <span>پرفروش ترین</span>
                    <span x-show="sort === 4" class="w-2 h-2 bg-orange-600 rounded-full absolute top-1 left-1"></span>
                </button>
            </div>
        </div>
        <!-- product section content -->
        <div class="col-span-12 md:col-span-8 lg:col-span-9 xl:col-span-10 pb-24">
            <div x-data="{
                  products: [
                      {id: 1 , title: 'ساعت هوشمند اپل سری 7' , price: '12,950,000 تومان'},
                      {id: 2 , title: 'ساعت هوشمند اپل سری 8' , price: '14,780,000 تومان'},
                      {id: 3 , title: 'ساعت هوشمند اپل سری 5' , price: '10,630,000 تومان'},
                      {id: 4 , title: 'ساعت هوشمند اپل سری 2' , price: '9,590,000 تومان'},
                      {id: 5 , title: 'ساعت هوشمند اپل سری 1' , price: '6,480,000 تومان'},
                      {id: 6 , title: 'ساعت هوشمند اپل سری 6' , price: '11,250,000 تومان'},
                      {id: 7 , title: 'ساعت هوشمند اپل سری 3' , price: '9,250,000 تومان'},
                      {id: 8 , title: 'ساعت هوشمند اپل سری 10' , price: '18,250,000 تومان'},
                  ]
              }"
                class="grid gap-x-2 gap-y-8 grid-cols-2 md:grid-cols-3 lg:grid-cols-4 px-2 md:p-0 md:gap-x-6 md:gap-y-10">
                <template x-for="product in products" :key="product.id">
                    <div class="bg-white rounded-xl p-2 shadow-md">
                        <div class="mb-3 bg-gray-100 rounded-xl p-2">
                            <img src="../assets/images/apple-watch-7.png" alt="apple watch 7" />
                        </div>
                        <!-- product description -->
                        <div class="flex items-center justify-between w-full mb-4">
                            <span class="text-slate-600 text-sm md:text-base lg:text-lg">اپل</span>
                            <!-- circles -->
                            <div class="flex items-center" x-data="{color: 'red'}">
                                <div @click="color= 'red'" :class="color === 'red' ? 'ring-2 ring-red-500 ' : '' "
                                    class="w-6 h-6 sm:w-8 sm:h-8 lg:w-9 lg:h-9 rounded-full cursor-pointer bg-red-500 border-2 border-white flex items-center justify-center">
                                    <svg x-show="color === 'red' " xmlns="http://www.w3.org/2000/svg" fill="none"
                                        viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                                        class="w-4 h-4 sm:w-5 sm:h-5 lg:w-6 lg:h-6 stroke-black">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="m4.5 12.75 6 6 9-13.5" />
                                    </svg>
                                </div>
                                <div @click="color= 'blue' " :class="color === 'blue' ? 'ring-2 ring-blue-500' : '' "
                                    class="w-6 h-6 sm:w-8 sm:h-8 lg:w-9 lg:h-9 rounded-full cursor-pointer bg-blue-500 -mr-1.5 border-2 border-white flex items-center justify-center">
                                    <svg x-show="color === 'blue' " xmlns="http://www.w3.org/2000/svg" fill="none"
                                        viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                                        class="w-4 h-4 sm:w-5 sm:h-5 lg:w-6 lg:h-6 stroke-black">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="m4.5 12.75 6 6 9-13.5" />
                                    </svg>
                                </div>
                                <div @click="color= 'yellow' "
                                    :class="color === 'yellow' ? 'ring-2 ring-yellow-500' : '' "
                                    class="w-6 h-6 sm:w-8 sm:h-8 lg:w-9 lg:h-9 rounded-full cursor-pointer bg-yellow-500 -mr-1.5 border-2 border-white flex items-center justify-center">
                                    <svg x-show="color === 'yellow' " xmlns="http://www.w3.org/2000/svg" fill="none"
                                        viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                                        class="w-4 h-4 sm:w-5 sm:h-5 lg:w-6 lg:h-6 stroke-black">
                                        <path stroke-linecap="round" stroke-linejoin="round"
                                            d="m4.5 12.75 6 6 9-13.5" />
                                    </svg>
                                </div>
                            </div>
                        </div>
                        <!-- product title -->
                        <div x-text="product.title"
                            class="text-slate-800 text-xs sm:text-base lg:text-lg font-bold mb-2">
                            <!-- title -->
                        </div>
                        <div x-text="product.price"
                            class="text-orange-600 font-medium text-center sm:text-base text-sm mb-4">
                            <!-- price -->
                        </div>
                        <hr class="mb-2" />
                        <button class="w-full py-1 font-bold text-orange-600 md:text-base lg:text-lg">مشاهده و
                            سفارش</button>
                    </div>
                </template>
            </div>
        </div>
