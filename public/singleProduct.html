<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Single Product</title>
    <link rel="stylesheet" href="./build/tailwind.css" />
</head>
<body class="bg-gray-100">
    <!-- app bar -->
    <div class="flex md:hidden items-center justify-between mt-10 px-4 mb-6">
        <div class="">
            <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 20.25h12m-7.5-3v3m3-3v3m-10.125-3h17.25c.621 0 1.125-.504 1.125-1.125V4.875c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125Z" />
            </svg>
        </div>
        <div class="text-lg font-bold text-slate-800">موبایل هوشمند</div>
        <div class="w-7 h-7 rounded items-center justify-center bg-white shadow-lg flex">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor" class="h-5 w-5 stroke-slate-800">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
        </div>
    </div>
    <!-- BreadCrumbs -->
     <div class="flex items-center gap-x-1 px-4 text-sm mb-8">
        <span class="text-orange-500">تلفن همراه</span>
        <span>
            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
            </svg>
        </span>
        <span class="text-orange-500">برند آیفون</span>
        <span>
            <svg class="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
            </svg>
        </span>        
        <span class="text-gray-500">آیفون 13</span>
     </div>
     <!-- Single product -->
      <div class="flex px-4 flex-col items-center gap-y-9">
        <div class="w-4/5 max-w-xs">
            <img class="w-full h-auto" src="/assets/images/iphone-13.png" />
        </div>
        <div class="">
            <div class="mb-8 text-center">
                <h1 class="text-slate-800 font-bold text-lg mb-1">گوشی آیفون 13 pro max</h1>
                <h2 class="font-thin text-gray-500">Apple Iphone 13 256 GB</h2>
            </div>
            <!-- color selection -->
             <div class="flex items-center justify-evenly gap-x-4 w-full mb-5">
                <span class="text-slate-800 text-md md:text-base lg:text-lg">انتخاب رنگ :</span>
                <!-- circles -->
                <div class="flex items-center" x-data="{color: 'red'}">
                    <div @click="color= 'red'" :class="color === 'red' ? 'ring-2 ring-red-500 ' : '' "
                        class="w-7 h-7 sm:w-9 sm:h-9 lg:w-10 lg:h-10 rounded-full cursor-pointer bg-red-500 border-2 border-white flex items-center justify-center">
                        <svg x-show="color === 'red' " xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                            class="w-5 h-5 sm:w-6 sm:h-6 stroke-black">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m4.5 12.75 6 6 9-13.5" />
                        </svg>
                    </div>
                    <div @click="color= 'blue' " :class="color === 'blue' ? 'ring-2 ring-blue-500' : '' "
                        class="w-7 h-7 sm:w-9 sm:h-9 lg:w-10 lg:h-10 rounded-full cursor-pointer bg-blue-500 -mr-1.5 border-2 border-white flex items-center justify-center">
                        <svg x-show="color === 'blue' " xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                            class="w-5 h-5 sm:w-6 sm:h-6 stroke-black">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m4.5 12.75 6 6 9-13.5" />
                        </svg>
                    </div>
                    <div @click="color= 'yellow' "
                        :class="color === 'yellow' ? 'ring-2 ring-yellow-500' : '' "
                        class="w-7 h-7 sm:w-9 sm:h-9 lg:w-10 lg:h-10 rounded-full cursor-pointer bg-yellow-500 -mr-1.5 border-2 border-white flex items-center justify-center">
                        <svg x-show="color === 'yellow' " xmlns="http://www.w3.org/2000/svg" fill="none"
                            viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor"
                            class="w-5 h-5 sm:w-6 sm:h-6 stroke-black">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="m4.5 12.75 6 6 9-13.5" />
                        </svg>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
