<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سبد خرید</title>
    <link rel="stylesheet" href="./build/tailwind.css" />
</head>
<body class="bg-gray-100">
    <div>
        <!-- app bar -->
        <div class="flex md:hidden items-center justify-between mt-10 px-4 mb-6">
            <div class="">
                <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 20.25h12m-7.5-3v3m3-3v3m-10.125-3h17.25c.621 0 1.125-.504 1.125-1.125V4.875c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125Z" />
                </svg>
            </div>
            <div class="text-lg font-bold text-slate-800">سبد خرید</div>
            <div class="w-7 h-7 rounded items-center justify-center bg-white shadow-lg flex">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                    stroke="currentColor" class="h-5 w-5 stroke-slate-800">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                </svg>
            </div>
        </div>
         <!-- desktop navbar -->
        <div>
        <nav class="bg-white p-4 shadow-lg sticky z-10 top-0 hidden md:block mb-8">
            <div class="container 2xl:max-w-screen-2xl mx-auto flex items-center justify-between">
                <ul class="flex items-center gap-x- lg:gap-x-2 text-slate-800 text-lg">
                    <li>
                        <a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-100 transition-all duration-300">
                            LOGO
                        </a>
                    </li>
                    <li>
                        <a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-100 transition-all duration-300">
                            خانه
                        </a>
                    </li>
                    <li>
                        <a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-100 transition-all duration-300">
                            لپ تاپ
                        </a>
                    </li>
                    <li>
                        <a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-100 transition-all duration-300">
                            تب لت
                        </a>
                    </li>
                    <li>
                        <a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-100 transition-all duration-300">
                            ساعت هوشمند
                        </a>
                    </li>
                    <li>
                        <a href="#" class="block px-4 py-2 rounded-md hover:bg-gray-100 transition-all duration-300">
                            تلفن همراه
                        </a>
                    </li>
                </ul>
                <!-- search bar -->
                <div class="flex-1 max-w-xl mr-4 ">
                    <div class="flex bg-gray-100 p-1 rounded-lg items-center">
                        <span class="ml-3 mr-1">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                                <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
                            </svg>
                        </span>
                        <input 
                            type="text" placeholder="نام محصول برند یا رنگ ..." 
                            class="focus:outline-none bg-transparent w-full p-2 text-slate-800"
                        />
                    </div>
                </div>
            </div>
        </nav>
        </div>

       <!-- cart content -->
        <div class="flex items-start container mx-auto 2xl:max-w-screen-2xl">
            <!-- cart items -->
            <div 
                class="flex flex-col md:gap-y-4 gap-y-2 px-4 flex-1"
                x-data="{
                    products: [
                        {id: 1 , title: 'ساعت هوشمند اپل سری 2' , quantity: '1' , price: '10,950,000 تومان'},
                        {id: 2 , title: 'ساعت هوشمند اپل سری 3' , quantity: '2' , price: '11,450,000 تومان'},
                        {id: 3 , title: 'ساعت هوشمند اپل سری 4' , quantity: '6' , price: '12,360,000 تومان'}, 
                        {id: 4 , title: 'ساعت هوشمند اپل سری 5' , quantity: '3' , price: '13,800,000 تومان'},  
                        {id: 5 , title: 'ساعت هوشمند اپل سری 6' , quantity: '10' , price: '14,950,000 تومان'},  
                        {id: 6 , title: 'ساعت هوشمند اپل سری 7' , quantity: '15' , price: '15,550,000 تومان'},  
                        {id: 7 , title: 'ساعت هوشمند اپل سری 8' , quantity: '3' , price: '16,950,000 تومان'},  
                        {id: 8 , title: 'ساعت هوشمند اپل سری 9' , quantity: '16' , price: '17,150,000 تومان'},  
                        {id: 9 , title: 'ساعت هوشمند اپل سری 10' , quantity: '56' , price: '19,950,000 تومان'}  
 
                    ]
                }"
            >
                <template x-for="product in products" :key="product.id">
                    <div class="bg-white rounded-lg p-3 flex items-stretch shadow-lg justify-between">
                    <div class="w-16 md:w-24 h-auto">
                        <img src="/assets/images/apple-watch-7.png" class="w-full h-auto" />
                    </div>
                    <div class="flex flex-col flex-1 justify-between text-xs md:text-xl lg:text-lg">
                        <span class="font-bold text-slate-800" x-text="product.title"></span>
                        <span class="text-orange-500" x-text="product.price"></span>
                    </div>
                    <div class="flex flex-col justify-between items-end gap-x-2">
                        <!-- close icon -->
                        <span>
                            <svg class="w-5 h-5 stroke-orange-500" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-width="1.5">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                            </svg>
                        </span>
                        <!-- plus and minus icon -->
                        <div class="flex items-center gap-x-1 md:gap-x-3">
                            <span class="flex items-center justify-center w-4 h-4 md:w-6 md:h-6 rounded-full bg-gray-200">
                                <svg class="h-3 w-3 md:w-5 md:h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
                                </svg>
                            </span>
                            <span class="flex items-center justify-center border border-orange-500 rounded-md w-5 h-7 md:w-7 md:h-9  text-sm md:text-base" x-text="product.quantity"></span>
                            <span class="flex items-center justify-center rounded-full bg-orange-100 w-5 h-5 md:w-7 md:h-7">
                                <svg class="w-3 h-3 md:w-5 md:h-5 stroke-orange-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14" />
                                </svg>
                            </span>
                        </div>
                    </div>
                    </div>
                </template>
            </div>
            <!-- cart detail -->
            <div class="md:block hidden w-1/3 xl:w-1/4 max-w-sm">
                <div class="bg-white mb-5 px-4 py-5 rounded-lg w-full text-slate-800 font-medium">
                    <div class="flex items-center justify-between mb-5">
                        <span class="text-lg">مجموع قیمت :</span>
                        <span class="text-orange-500">35,450,000 تومان</span>
                    </div>
                    <div class="flex items-center justify-between mb-5">
                        <span class="font-light text-lg">کد تخفیف :</span>
                        <div class="flex items-stretch justify-between overflow-hidden rounded-xl bg-gray-200">
                            <input 
                                type="text" 
                                dir="ltr" 
                                class="border-0 w-full max-w-[150px] bg-transparent p-2 text-gray-700 outline-none focus:outline-none" 
                                placeholder="AS-DM210"
                            />
                            <button class="border-0 bg-orange-500 px-4 text-white outline-none">تایید</button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between mb-11">
                        <span class="text-lg">تخفیف :</span>
                        <span class="text-orange-500">450,000 تومان</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-lg">قیمت نهایی :</span>
                        <span class="text-orange-500">35,000,000 تومان</span>
                    </div>
                </div>
                <div class="mb-2">
                    <button class="w-full p-4 rounded-lg text-md font-bold items-center text-white bg-orange-500">اضافه به سبد خرید</button>
                </div>
                <div>
                    <button class="w-full p-4 rounded-lg text-md font-bold items-center border border-orange-500 text-orange-500 bg-white">انصراف از خرید</button>
                </div>
            </div>
        </div>
    </div>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
